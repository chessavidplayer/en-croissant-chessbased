name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:

          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            aix_target: "osx_arm64"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            aix_target: "osx_amd64"
          - platform: "ubuntu-24.04"
            args: ""
            aix_target: "linux_amd64"
          - platform: "windows-latest"
            args: "--no-bundle"
            aix_target: "windows_amd64"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SKIP_SIGNING: true
          AIX_EXTENSION_TARGET: ${{ matrix.aix_target }}
          AIX_EXTENSION_FORCE_DOWNLOAD: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}