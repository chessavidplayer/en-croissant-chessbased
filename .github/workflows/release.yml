name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            # We change args to only build the exe and skip the installer/bundle part if needed
            args: '--no-bundle' 
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This line is the magic trick to skip the error you saw
          TAURI_SKIP_SIGNING: true 
          CI: false
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # THIS IS THE NEW STEP TO GIVE YOU THE DOWNLOAD LINK
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: En-Croissant-Windows-EXE
          path: src-tauri/target/release/en-croissant.exe
